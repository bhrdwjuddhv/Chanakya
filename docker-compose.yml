name: chanakya

services:
  mongo:
    image: mongo:7
    # 27018 on the host: a locally-installed mongod also binds 27017, and the app would
    # silently connect to that empty database instead of this one.
    ports: ['27018:27017']
    volumes: ['mongo_data:/data/db']

  neo4j:
    image: neo4j:5.26
    ports: ['7474:7474', '7687:7687']
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'gds.*,apoc.*'
      NEO4J_dbms_security_procedures_allowlist: 'gds.*,apoc.*'
    volumes: ['neo4j_data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:7474 || exit 1']
      interval: 10s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ['6333:6333']
    volumes: ['qdrant_data:/qdrant/storage']

  # Face recognition. The server refuses to start without a model installed, so run
  # the `models` service below once first. Serves on 8080 inside, 18097 on the host.
  insightface:
    image: ghcr.io/deepinsight/insightface-server:0.2.0-cpu
    ports: ['18097:8080']
    environment:
      INSIGHTFACE_AUTH_ENABLED: 'false'
    volumes:
      - './.models:/models'
      - 'insightface_data:/data'

  # One-time model install:  docker compose run --rm models
  # Downloading buffalo_l accepts the InsightFace model licence — non-commercial use only.
  models:
    image: ghcr.io/deepinsight/insightface-server:0.2.0-cpu
    entrypoint:
      - python
      - -c
      - |
        import sys
        from pathlib import Path
        import insightface_server.models.packages as p
        name = sys.argv[1] if len(sys.argv) > 1 else "buffalo_l"
        print(p.install_package(p.PACKAGES[name], Path("/models")))
    volumes: ['./.models:/models']
    profiles: ['tools']

  # Fingerprint AFIS (SourceAFIS sidecar) — built in Phase 6.
  afis:
    build: ./afis-service
    ports: ['8090:8090']
    profiles: ['biometrics']

volumes:
  insightface_data:
  mongo_data:
  neo4j_data:
  qdrant_data:
