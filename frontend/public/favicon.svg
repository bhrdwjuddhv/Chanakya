<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Chanakya">
  <!-- A network with one broker at its centre — the thing the product actually finds. -->
  <rect width="32" height="32" rx="7" fill="#0A0A0A" />
  <g stroke="#C90003" stroke-width="1.3" stroke-linecap="round" opacity="0.75">
    <path d="M16 16 L8 8" />
    <path d="M16 16 L24 8" />
    <path d="M16 16 L7 21" />
    <path d="M16 16 L25 21" />
    <path d="M16 16 L16 26" />
  </g>
  <g fill="#DBDBDB">
    <circle cx="8" cy="8" r="2.1" />
    <circle cx="24" cy="8" r="2.1" />
    <circle cx="7" cy="21" r="2.1" />
    <circle cx="25" cy="21" r="2.1" />
    <circle cx="16" cy="26" r="2.1" />
  </g>
  <!-- The broker: larger, accent-red, haloed. -->
  <circle cx="16" cy="16" r="5.4" fill="#C90003" opacity="0.22" />
  <circle cx="16" cy="16" r="3.4" fill="#C90003" />
</svg>
